{% if helpers.exists('OPNsense.EasyTier.general') %}
{% if OPNsense.EasyTier.general.enabled|default("0") == "1" %}
{% if OPNsense.EasyTier.general.ipv4|default("") != "" %}
ipv4 = "{{ OPNsense.EasyTier.general.ipv4 }}"
{% endif %}
{% if OPNsense.EasyTier.general.dhcp|default("0") == "1" %}
dhcp = true
{% endif %}
{% if OPNsense.EasyTier.general.hostname|default("") != "" %}
hostname = "{{ OPNsense.EasyTier.general.hostname }}"
{% endif %}
{% if OPNsense.EasyTier.general.default_protocol|default("") != "" and OPNsense.EasyTier.general.default_protocol != "udp" %}
default_protocol = "{{ OPNsense.EasyTier.general.default_protocol }}"
{% endif %}
{% if OPNsense.EasyTier.general.listeners|default("") != "" %}
listeners = [{% for listener in OPNsense.EasyTier.general.listeners.replace("\n",",").split(",") %}{% if listener|trim != "" %}"{{ listener|trim }}"{% if not loop.last %}, {% endif %}{% endif %}{% endfor %}]
{% endif %}
{% if OPNsense.EasyTier.general.rpc_portal|default("") != "" %}
rpc_portal = "{{ OPNsense.EasyTier.general.rpc_portal }}"
{% endif %}
{% if OPNsense.EasyTier.general.external_node|default("") != "" %}
external_node = "{{ OPNsense.EasyTier.general.external_node }}"
{% endif %}
{% if OPNsense.EasyTier.general.socks5_portal|default("") != "" %}
socks5_portal = "{{ OPNsense.EasyTier.general.socks5_portal }}"
{% endif %}

[network_identity]
network_name = "{{ OPNsense.EasyTier.general.network_name }}"
network_secret = "{{ OPNsense.EasyTier.general.network_secret }}"

{% if OPNsense.EasyTier.general.peers|default("") != "" %}
{% for peer in OPNsense.EasyTier.general.peers.replace("\n",",").split(",") %}
{% if peer|trim != "" %}
[[peer]]
uri = "{{ peer|trim }}"
{% endif %}
{% endfor %}
{% endif %}

{% if OPNsense.EasyTier.general.proxy_networks|default("") != "" %}
{% for net in OPNsense.EasyTier.general.proxy_networks.replace("\n",",").split(",") %}
{% if net|trim != "" %}
[[proxy_network]]
cidr = "{{ net|trim }}"
{% endif %}
{% endfor %}
{% endif %}

[flags]
dev_name = "easytier0"
{% if OPNsense.EasyTier.general.relay_all_peer_rpc|default("0") == "1" %}
relay_all_peer_rpc = true
{% endif %}
{% if OPNsense.EasyTier.general.disable_p2p|default("0") == "1" %}
disable_p2p = true
{% endif %}
{% if OPNsense.EasyTier.general.disable_udp_hole_punching|default("0") == "1" %}
disable_udp_hole_punching = true
{% endif %}
{% if OPNsense.EasyTier.general.disable_sym_hole_punching|default("0") == "1" %}
disable_sym_hole_punching = true
{% endif %}
{% if OPNsense.EasyTier.general.multi_thread|default("0") == "1" %}
multi_thread = true
{% endif %}
{% if OPNsense.EasyTier.general.latency_first|default("0") == "1" %}
latency_first = true
{% endif %}
{% if OPNsense.EasyTier.general.enable_exit_node|default("0") == "1" %}
enable_exit_node = true
{% endif %}
{% if OPNsense.EasyTier.general.no_tun|default("0") == "1" %}
no_tun = true
{% endif %}
{% if OPNsense.EasyTier.general.disable_ipv6|default("0") == "1" %}
disable_ipv6 = true
{% endif %}
{% if OPNsense.EasyTier.general.private_mode|default("0") == "1" %}
private_mode = true
{% endif %}
{% if OPNsense.EasyTier.general.relay_network_whitelist|default("") != "" %}
relay_network_whitelist = [{% for net in OPNsense.EasyTier.general.relay_network_whitelist.replace("\n",",").split(",") %}{% if net|trim != "" %}"{{ net|trim }}"{% if not loop.last %}, {% endif %}{% endif %}{% endfor %}]
{% endif %}

{% endif %}
{% endif %}
