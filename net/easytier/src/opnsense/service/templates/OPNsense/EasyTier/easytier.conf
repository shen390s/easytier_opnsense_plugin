{% if helpers.exists('OPNsense.EasyTier.general') %}
{% set general = helpers.toList('OPNsense.EasyTier.general') %}
{% if general.enabled|default("0") == "1" %}
#
# EasyTier configuration file - auto-generated by OPNsense
# Do not edit manually
#

[network_identity]
network_name = "{{ general.network_name }}"
network_secret = "{{ general.network_secret }}"

{% if general.hostname|default("") != "" %}
[peer]
hostname = "{{ general.hostname }}"
{% endif %}

{% if general.ipv4|default("") != "" %}
[network]
ipv4 = "{{ general.ipv4 }}"
{% endif %}

{% if general.dhcp|default("0") == "1" %}
[network]
dhcp = true
{% endif %}

{% if general.listeners|default("") != "" %}
[listener]
listeners = [
{% for listener in general.listeners.split(",") %}
    "{{ listener|trim }}",
{% endfor %}
]
{% endif %}

{% if general.peers|default("") != "" %}
[peer]
peers = [
{% for peer in general.peers.split(",") %}
    "{{ peer|trim }}",
{% endfor %}
]
{% endif %}

{% if general.proxy_networks|default("") != "" %}
[proxy_network]
proxy_networks = [
{% for net in general.proxy_networks.split(",") %}
    "{{ net|trim }}",
{% endfor %}
]
{% endif %}

{% if general.rpc_portal|default("") != "" %}
[rpc]
portal = "{{ general.rpc_portal }}"
{% endif %}

{% if general.external_node|default("") != "" %}
[peer]
external_node = "{{ general.external_node }}"
{% endif %}

[flags]
{% if general.relay_all_peer_rpc|default("0") == "1" %}
relay_all_peer_rpc = true
{% endif %}
{% if general.disable_p2p|default("0") == "1" %}
disable_p2p = true
{% endif %}
{% if general.disable_udp_hole_punching|default("0") == "1" %}
disable_udp_hole_punching = true
{% endif %}
{% if general.multi_thread|default("0") == "1" %}
multi_thread = true
{% endif %}
{% if general.latency_first|default("0") == "1" %}
latency_first = true
{% endif %}
{% if general.enable_exit_node|default("0") == "1" %}
enable_exit_node = true
{% endif %}
{% if general.no_tun|default("0") == "1" %}
no_tun = true
{% endif %}

{% if general.socks5_portal|default("") != "" %}
[socks5]
portal = "{{ general.socks5_portal }}"
{% endif %}

{% if general.relay_network_whitelist|default("") != "" %}
[relay]
network_whitelist = [
{% for net in general.relay_network_whitelist.split(",") %}
    "{{ net|trim }}",
{% endfor %}
]
{% endif %}

{% endif %}
{% endif %}
