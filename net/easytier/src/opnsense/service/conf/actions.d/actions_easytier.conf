[start]
command:/usr/local/etc/rc.d/easytier start
parameters:
type:script
message:starting easytier

[stop]
command:/usr/local/etc/rc.d/easytier stop
parameters:
type:script
message:stopping easytier

[restart]
command:/usr/local/etc/rc.d/easytier restart
parameters:
type:script
message:restarting easytier

[status]
command:/usr/local/etc/rc.d/easytier status; exit 0
parameters:
type:script_output
message:request easytier status

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/EasyTier/reconfigure.sh
parameters:
type:script
message:reconfiguring easytier
